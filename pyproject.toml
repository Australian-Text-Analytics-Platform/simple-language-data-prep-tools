[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-language-data-prep-tools"
description = "A collection of small tools for preparing language data for computational (text) analysis."
readme = "README.md"
requires-python = ">=3.10.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
  {name = "Sam Hames"},
]
classifiers=[
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "ipywidgets",
  "jupyterlab-server",
  "jupyterlite-core>=0.8.3",
  "jupyterlite-pyodide-kernel[lock]",
]

version="0.0.4"


[project.optional-dependencies]
dev = [
  "tox",
  "python-docx",
  "openpyxl",
  "jupyter"
]

[project.urls]
Repository = "https://github.com/AustralianTextAnalyticsPlatform/simple-language-data-prep-tools"
Homepage = "https://github.com/AustralianTextAnalyticsPlatform/simple-language-data-prep-tools"


[tool.setuptools]
package-dir = {"" = "notebooks"}
packages = ["simple_prep"]
